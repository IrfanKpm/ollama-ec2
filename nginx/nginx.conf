events {
    worker_connections 1024;
}

http {
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

    server {
        listen 80;
        server_name _;

        # Block requests with no API key
        if ($http_x_api_key = "") {
            return 401 '{"error": "Missing X-API-Key header"}';
        }

        # Block requests with wrong API key
        if ($http_x_api_key != "${API_SECRET_KEY}") {
            return 403 '{"error": "Invalid API Key"}';
        }

        location / {
            limit_req zone=api_limit burst=20 nodelay;

            proxy_pass http://ollama:11434;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;

            # Required for Ollama streaming responses
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 300s;
            chunked_transfer_encoding on;

            # Strip the key before forwarding to Ollama
            proxy_set_header X-API-Key "";
        }

        # Public health check — no key needed
        location /health {
            return 200 '{"status": "ok"}';
            add_header Content-Type application/json;
        }
    }
}